# Dev config for UI work: Admin API live, no auth, no real databases.
# Start:  go run ./cmd/janus serve --config ./janus.dev.yaml
# UI:     pnpm dev   (Vite proxies /api -> 127.0.0.1:8788)
# Add connections later by copying the commented block + setting the DSN env.
server:
  name: janus
  version: 0.1.0
  transport: http
  http:
    listen: "127.0.0.1:8787"

admin:
  enabled: true
  listen: "127.0.0.1:8788"

auth:
  mode: none
  tokens: []

connections: []
# Example (needs a reachable Postgres + env DSN):
# connections:
#   - name: "analytics"
#     driver: postgres
#     dsn_ref: "env:JANUS_ANALYTICS_DSN"
#     pool:
#       max_open: 5
#       max_idle: 2
#       conn_max_lifetime: "1h"
#     readonly: true
#     allowed_schemas: ["public"]
#     denied_tables: []
#     allowed_tables: []
#     row_limit: 500

policy:
  default_action: deny
  rules:
    - name: "allow-select"
      match:
        statement: ["SELECT", "WITH", "EXPLAIN", "SHOW"]
      action: allow

approval:
  enabled: true
  method: "cli"
  cli:
    prompt: false
  token_ttl: "5m"

credential:
  resolvers:
    - scheme: "env"
      prefix: "JANUS_"

audit:
  enabled: true
  sinks:
    - type: "stdout"
      format: "json"

redaction:
  enabled: false
  patterns: []
  columns: []

observability:
  log_level: "info"
  metrics:
    enabled: false
    listen: "127.0.0.1:9090"
    path: "/metrics"
  tracing:
    enabled: false
    otlp_endpoint: ""

limits:
  max_query_length: 10000
  query_timeout: "30s"
  max_concurrent_queries: 20
  rate_limit:
    enabled: false
    requests_per_minute: 60
